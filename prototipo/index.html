<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleve — Balcão (protótipo)</title>
<!-- Arquivo gerado por tools/build-prototipo.mjs a partir de design/canvas/Main.dc.html. Não edite à mão. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@400;500;600;700;800&amp;family=Permanent+Marker&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes ev-spin{to{transform:rotate(360deg)}}
@keyframes ev-pulse{0%,100%{opacity:1}50%{opacity:.45}}
.ev-spin{animation:ev-spin .8s linear infinite}
.ev-pulse{animation:ev-pulse 1.3s ease-in-out infinite}
.ev-app button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ev-app button:disabled{cursor:not-allowed}
.ev-app input,.ev-app select{font-family:inherit}
.ev-app input::placeholder{color:#6A5B48;opacity:1}
.ev-app button:focus-visible,.ev-app input:focus-visible,.ev-app select:focus-visible{outline:3px solid #221B16;outline-offset:2px}
.ev-noscroll{scrollbar-width:none}
.ev-noscroll::-webkit-scrollbar{display:none}
</style>
<style>html,body{height:100%}#root{height:100%}</style>
</head>
<body>
<template id="dc-template">
<div class="ev-app" ref="{{setRoot}}" style="position: relative; width: 100%; height: 100vh; overflow: hidden; background-color: #EDE5CE; background-image: linear-gradient(rgba(34,27,22,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(34,27,22,0.07) 1px, transparent 1px); background-size: 24px 24px; color: #221B16; font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.4">

<sc-if value="{{scr.login}}" hint-placeholder-val="{{true}}">
<div style="position: relative; height: 100%; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; padding: 28px 16px 48px; display: flex; flex-direction: column; align-items: center; justify-content: center">
  <div aria-hidden="true" style="position: absolute; left: -70px; bottom: 54px; width: 320px; height: 40px; background: #47566A; border-radius: 40px 10px 34px 14px; transform: rotate(-9deg)"></div>
  <div aria-hidden="true" style="position: absolute; right: -36px; top: 64px; width: 150px; height: 16px; background: #FBFF0C; border: 2px solid #221B16; transform: rotate(14deg)"></div>
  <div style="position: relative; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 18px">
      <img src="eleve-logo.png" alt="Eleve" style="flex: 0 0 96px; width: 96px; height: 96px; object-fit: cover; border-radius: 14px; border: 2.5px solid #221B16; transform: rotate(-5deg); box-shadow: 5px 5px 0 #221B16">
      <div style="display: flex; flex-direction: column; align-items: flex-start">
        <span style="padding: 6px 12px 3px; background: #DE4C24; color: #F6ECD8; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 46px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; transform: rotate(-2deg)">Balcão</span>
        <span style="margin: -2px 0 0 12px; padding: 5px 10px; background: #105F52; color: #F6ECD8; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">Estoque &amp; vendas</span>
      </div>
    </div>
    <span aria-hidden="true" style="align-self: flex-end; margin: -12px 8px -6px 0; font-family: 'Permanent Marker', cursive; font-size: 18px; color: #B3361A; transform: rotate(-5deg)">uso interno da equipe</span>

    <div style="position: relative; background: #FBF6E8; border: 2px solid #221B16; border-radius: 14px; padding: 26px 20px 22px; display: flex; flex-direction: column; gap: 18px">
      <span aria-hidden="true" style="position: absolute; top: -2px; right: 22px; width: 30px; height: 46px; background: #AC63D5; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%)"></span>
      <div>
        <h1 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 32px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase">Entrar</h1>
        <p style="margin: 6px 0 0; font-size: 15px; color: #4E4235">Use o e-mail e a senha criados pelo administrador.</p>
      </div>
      <sc-if value="{{lg.error}}" hint-placeholder-val="{{false}}">
        <div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; border: 2px solid #B3361A; background: #FAD5C8; color: #7E200A; font-size: 15px; line-height: 1.35">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 1px"><path d="{{I.alertCircle}}"></path></svg>
          <span><strong style="display: block; font-weight: 800">E-mail ou senha incorretos.</strong>Confira os dados e tente de novo. Esqueceu a senha? Fale com o administrador da loja.</span>
        </div>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ev-email" style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">E-mail</label>
        <input id="ev-email" type="email" inputmode="email" autoComplete="username" value="{{lg.email}}" onChange="{{lg.onEmail}}" onKeyDown="{{lg.onKey}}" aria-invalid="{{lg.emailInvalid}}" placeholder="seu.nome@eleve.com.br" style="box-sizing: border-box; width: 100%; height: 54px; padding: 0 16px; border-radius: 10px; border: 2px solid {{lg.emailBorder}}; background: #FFFDF6; font-size: 17px; color: #221B16">
        <sc-if value="{{lg.emailErr}}" hint-placeholder-val="{{false}}"><span style="color: #B3361A; font-size: 14px; font-weight: 700">{{lg.emailErr}}</span></sc-if>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ev-senha" style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">Senha</label>
        <div style="position: relative">
          <input id="ev-senha" type="{{lg.passType}}" autoComplete="current-password" value="{{lg.pass}}" onChange="{{lg.onPass}}" onKeyDown="{{lg.onKey}}" aria-invalid="{{lg.passInvalid}}" placeholder="Sua senha" style="box-sizing: border-box; width: 100%; height: 54px; padding: 0 56px 0 16px; border-radius: 10px; border: 2px solid {{lg.passBorder}}; background: #FFFDF6; font-size: 17px; color: #221B16">
          <button type="button" onClick="{{lg.togglePass}}" aria-label="{{lg.eyeLabel}}" style="position: absolute; right: 5px; top: 5px; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #4E4235; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{lg.eyeIcon}}"></path></svg>
          </button>
        </div>
        <sc-if value="{{lg.passErr}}" hint-placeholder-val="{{false}}"><span style="color: #B3361A; font-size: 14px; font-weight: 700">{{lg.passErr}}</span></sc-if>
      </div>
      <button type="button" onClick="{{lg.submit}}" disabled="{{lg.loading}}" aria-busy="{{lg.busy}}" style="height: 58px; margin-bottom: 4px; border: 2px solid #221B16; border-radius: 10px; background: {{lg.btnBg}}; color: #221B16; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 24px; letter-spacing: 0.03em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 0 #221B16">
        <sc-if value="{{lg.loading}}" hint-placeholder-val="{{false}}"><svg class="ev-spin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></sc-if>
        {{lg.btnLabel}}
      </button>
      <p style="margin: 0; text-align: center; font-size: 14px; color: #4E4235">Você continua conectado neste celular até tocar em Sair.</p>
    </div>
    <p style="margin: 0; text-align: center; font-size: 15px; color: #4E4235">Não tem acesso? As contas são criadas pelo administrador da loja.</p>
  </div>
</div>
</sc-if>

<sc-if value="{{scr.app}}" hint-placeholder-val="{{false}}">
<div style="height: 100%; display: flex; flex-direction: row">

  <sc-if value="{{L.desktop}}" hint-placeholder-val="{{false}}">
  <nav aria-label="Menu principal" style="flex: 0 0 256px; height: 100%; box-sizing: border-box; padding: 22px 16px; background: #221B16; color: #F6ECD8; display: flex; flex-direction: column; gap: 28px; overflow-y: auto">
    <div style="display: flex; align-items: center; gap: 14px; padding: 2px 4px 0">
      <img src="eleve-logo.png" alt="Eleve" style="flex: 0 0 54px; width: 54px; height: 54px; object-fit: cover; border-radius: 10px; transform: rotate(-5deg)">
      <div style="display: flex; flex-direction: column; align-items: flex-start">
        <span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 28px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; color: #F6ECD8">Balcão</span>
        <span style="margin-top: 5px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #FBFF0C">Estoque &amp; vendas</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.go}}" aria-current="{{t.current}}" style="display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 14px; border: 0; border-radius: 10px; background: {{t.sideBg}}; color: {{t.sideColor}}; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 21px; letter-spacing: 0.03em; text-transform: uppercase; text-align: left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          <span style="flex: 1 1 auto">{{t.label}}</span>
          <sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}"><span style="min-width: 26px; height: 26px; box-sizing: border-box; padding: 0 7px; border-radius: 6px; background: {{t.badgeBg}}; color: {{t.badgeColor}}; font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{t.badge}}</span></sc-if>
        </button>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 12px; background: #2E2520; border: 1.5px solid #4A3E34">
      <div style="display: flex; align-items: center; gap: 10px">
        <span aria-hidden="true" style="flex: 0 0 42px; height: 42px; border-radius: 999px; background: #FBFF0C; color: #221B16; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 14px">{{M.initials}}</span>
        <span style="display: flex; flex-direction: column; align-items: flex-start; min-width: 0">
          <span style="font-size: 15px; font-weight: 700">{{M.name}}</span>
          <span style="margin-top: 4px; padding: 2px 8px; background: {{M.roleBg}}; color: {{M.roleColor}}; font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">{{M.roleLabel}}</span>
        </span>
      </div>
      <span style="font-size: 13px; color: #D9CDB5">{{M.roleHelp}}</span>
      <button type="button" onClick="{{M.logout}}" style="height: 44px; border-radius: 10px; border: 2px solid #F6ECD8; background: transparent; color: #F6ECD8; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.logout}}"></path></svg>
        Sair
      </button>
    </div>
  </nav>
  </sc-if>

  <div style="flex: 1 1 auto; min-width: 0; height: 100%; display: flex; flex-direction: column">

    <sc-if value="{{L.mobile}}" hint-placeholder-val="{{true}}">
    <header style="flex: 0 0 auto; height: 64px; box-sizing: border-box; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 10px; background: #EDE5CE; border-bottom: 2px solid #221B16">
      <img src="eleve-logo.png" alt="Eleve" style="flex: 0 0 42px; width: 42px; height: 42px; object-fit: cover; border-radius: 8px; border: 2px solid #221B16; transform: rotate(-5deg)">
      <span style="flex: 1 1 auto; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 24px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase">Balcão</span>
      <span style="padding: 4px 8px; background: {{M.roleBg}}; color: {{M.roleColor}}; font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">{{M.roleLabel}}</span>
      <button type="button" onClick="{{M.toggle}}" aria-label="Abrir menu da conta" aria-expanded="{{M.expanded}}" style="width: 44px; height: 44px; border-radius: 999px; border: 2px solid #221B16; background: #221B16; color: #FBFF0C; font-family: 'Space Mono', ui-monospace, monospace; font-size: 14px; font-weight: 700">{{M.initials}}</button>
    </header>
    </sc-if>

    <main ref="{{setMain}}" style="flex: 1 1 auto; min-height: 0; overflow-y: auto">
      <div style="max-width: 1180px; margin: 0 auto; padding: {{L.mainPad}}; box-sizing: border-box">

        <sc-if value="{{scr.venda}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 4px">
            <div style="display: flex; flex-direction: column; align-items: flex-start">
              <h1 style="margin: 0; padding: 6px 14px 3px; background: #DE4C24; color: #F6ECD8; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 34px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; transform: rotate(-1.5deg); transform-origin: left bottom">Nova venda</h1>
              <p style="margin: -1px 0 0 12px; padding: 5px 10px; background: #105F52; color: #F6ECD8; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase">{{V.sellerLine}}</p>
            </div>
            <sc-if value="{{V.hasItems}}" hint-placeholder-val="{{false}}">
              <button type="button" onClick="{{V.clearCart}}" style="flex: 0 0 auto; height: 44px; padding: 0 14px; border-radius: 10px; border: 2px solid #221B16; background: #FBF6E8; color: #221B16; font-family: inherit; font-size: 15px; font-weight: 700">Limpar venda</button>
            </sc-if>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

            <section aria-label="Buscar produtos" style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
              <div style="position: relative">
                <label for="ev-busca-venda" style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0">Buscar produto pelo nome</label>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 16px; top: 17px; color: #221B16"><path d="{{I.search}}"></path></svg>
                <input id="ev-busca-venda" type="text" enterkeyhint="search" autoComplete="off" value="{{V.query}}" onChange="{{V.onQuery}}" placeholder="Buscar produto pelo nome" style="box-sizing: border-box; width: 100%; height: 56px; padding: 0 52px 0 50px; border-radius: 10px; border: 2px solid #221B16; background: #FFFDF6; font-size: 17px; color: #221B16">
                <sc-if value="{{V.hasQuery}}" hint-placeholder-val="{{false}}">
                  <button type="button" onClick="{{V.clearQuery}}" aria-label="Limpar busca" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #4E4235; display: flex; align-items: center; justify-content: center">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.x}}"></path></svg>
                  </button>
                </sc-if>
              </div>

              <sc-if value="{{V.showResults}}" hint-placeholder-val="{{false}}">
              <div style="background: #FBF6E8; border: 2px solid #221B16; border-radius: 12px; overflow: hidden">
                <div style="display: flex; justify-content: space-between; gap: 8px; padding: 9px 14px; background: #221B16; color: #F6ECD8; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
                  <span>{{V.resultsTitle}}</span>
                  <span style="color: #FBFF0C">{{V.moreText}}</span>
                </div>
                <sc-for list="{{V.results}}" as="r" hint-placeholder-count="4">
                  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-bottom: 1.5px dashed #CDBD99; background: {{r.rowBg}}">
                    <span aria-hidden="true" style="flex: 0 0 48px; height: 48px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #221B16; background: {{r.th.bg}}; color: {{r.th.ink}}; display: flex; align-items: center; justify-content: center">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.th.icon}}"></path></svg>
                    </span>
                    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                      <span style="font-size: 16px; font-weight: 700; line-height: 1.25">{{r.nome}}</span>
                      <span style="font-size: 13px; color: #4E4235">{{r.cat}} · <span style="color: {{r.stockColor}}; font-weight: {{r.stockWeight}}">{{r.stockText}}</span></span>
                      <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 15px; font-weight: 700">{{r.price}}</span>
                    </div>
                    <button type="button" onClick="{{r.add}}" disabled="{{r.disabled}}" aria-label="{{r.aria}}" style="flex: 0 0 auto; height: 48px; padding: 0 12px; border-radius: 10px; border: 2px solid {{r.addBorder}}; background: {{r.addBg}}; color: {{r.addColor}}; font-family: inherit; font-size: 14px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; display: flex; align-items: center; gap: 6px">
                      <sc-if value="{{r.canAdd}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.ic.plus}}"></path></svg></sc-if>
                      {{r.addLabel}}
                    </button>
                  </div>
                </sc-for>
              </div>
              </sc-if>

              <sc-if value="{{V.noResults}}" hint-placeholder-val="{{false}}">
              <div role="status" style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 12px; border: 2px dashed #4E4235; background: #FBF6E8">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 22px; color: #4E4235"><path d="{{I.search}}"></path></svg>
                <span style="font-size: 15px; color: #4E4235"><strong style="display: block; color: #221B16; font-size: 16px">Nenhum produto encontrado</strong>{{V.noResultsText}}</span>
              </div>
              </sc-if>
            </section>

            <section aria-label="Venda atual" style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

              <div style="background: #FBF6E8; border: 2px solid #221B16; border-radius: 12px; overflow: hidden">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 2px solid #221B16">
                  <h2 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 24px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase">Carrinho</h2>
                  <span style="padding: 3px 8px; background: #FBFF0C; border: 1.5px solid #221B16; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; text-transform: uppercase">{{V.itemCountText}}</span>
                </div>
                <sc-if value="{{V.empty}}" hint-placeholder-val="{{false}}">
                <div style="padding: 30px 20px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
                  <span aria-hidden="true" style="width: 76px; height: 76px; box-sizing: border-box; border-radius: 999px; border: 2px solid #221B16; background: #FBFF0C; color: #221B16; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg)">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{I.bag}}"></path></svg>
                  </span>
                  <strong style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase">Carrinho vazio</strong>
                  <span style="font-size: 15px; color: #4E4235; max-width: 300px">{{V.emptyHint}}</span>
                  <span aria-hidden="true" style="margin-top: 2px; font-family: 'Permanent Marker', cursive; font-size: 17px; color: #B3361A; transform: rotate(-3deg)">bora vender!</span>
                </div>
                </sc-if>
                <sc-for list="{{V.cartItems}}" as="ci" hint-placeholder-count="2">
                  <div style="padding: 14px; border-bottom: 1.5px dashed #CDBD99; display: flex; flex-direction: column; gap: 12px">
                    <div style="display: flex; gap: 12px; align-items: flex-start">
                      <span aria-hidden="true" style="flex: 0 0 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #221B16; background: {{ci.th.bg}}; color: {{ci.th.ink}}; display: flex; align-items: center; justify-content: center">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ci.th.icon}}"></path></svg>
                      </span>
                      <div style="flex: 1 1 auto; min-width: 0">
                        <div style="font-size: 16px; font-weight: 700; line-height: 1.25">{{ci.nome}}</div>

          <sc-if value="{{E.loading}}" hint-placeholder-val="{{false}}">

            <span role="status" style="display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: #4E4235">

            </span>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px">

                  <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 9px; padding-top: 4px">

                    <span style="height: 12px; width: 45%; background: #E4D8BE"></span>
                    <span style="height: 16px; width: 30%; background: #E4D8BE"></span>
                  </span>
                </div>
              </sc-for>
            </div>
          </div>
          </sc-if>

          <sc-if value="{{E.error}}" hint-placeholder-val="{{false}}">
          <div role="alert" style="background: #FBF6E8; border: 2px solid #221B16; border-radius: 12px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
            <span aria-hidden="true" style="width: 76px; height: 76px; border-radius: 999px; background: #221B16; color: #FBFF0C; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg)">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{I.wifiOff}}"></path></svg>
            </span>
            <strong style="padding: 6px 12px 3px; background: #DE4C24; color: #F6ECD8; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 28px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; transform: rotate(-1.5deg)">Sem conexão</strong>
            <span style="max-width: 320px; font-size: 15px; color: #4E4235">Não foi possível carregar o estoque. Verifique o Wi-Fi ou os dados móveis e tente de novo.</span>
            <button type="button" onClick="{{E.retry}}" style="margin-top: 6px; height: 54px; padding: 0 20px; border-radius: 10px; border: 2px solid #221B16; background: #FBFF0C; color: #221B16; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 22px; letter-spacing: 0.03em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 0 #221B16">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.refresh}}"></path></svg>
              Tentar novamente
            </button>
          </div>
          </sc-if>

          <sc-if value="{{E.empty}}" hint-placeholder-val="{{false}}">
          <div role="status" style="border: 2px dashed #4E4235; background: #FBF6E8; border-radius: 12px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
            <span aria-hidden="true" style="width: 76px; height: 76px; box-sizing: border-box; border-radius: 999px; border: 2px solid #221B16; background: #FBFF0C; color: #221B16; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg)">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{I.search}}"></path></svg>
            </span>
            <strong style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase">{{E.emptyTitle}}</strong>
            <span style="max-width: 320px; font-size: 15px; color: #4E4235">{{E.emptyText}}</span>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px">
              <button type="button" onClick="{{E.clearFilters}}" style="height: 48px; padding: 0 16px; border-radius: 10px; border: 2px solid #221B16; background: #FBF6E8; color: #221B16; font-family: inherit; font-size: 16px; font-weight: 700">Limpar busca e filtros</button>
              <sc-if value="{{E.isAdmin}}" hint-placeholder-val="{{false}}">
                <button type="button" onClick="{{E.newProduct}}" style="height: 48px; padding: 0 16px; border-radius: 10px; border: 2px solid #221B16; background: #FBFF0C; color: #221B16; font-family: inherit; font-size: 16px; font-weight: 800">Cadastrar produto</button>
              </sc-if>
            </div>
          </div>
          </sc-if>

          <sc-if value="{{E.list}}" hint-placeholder-val="{{true}}">
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px">

                <div style="padding: 14px; display: flex; gap: 14px; align-items: flex-start">
                  <span aria-hidden="true" style="flex: 0 0 60px; height: 60px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #221B16; background: {{p.th.bg}}; color: {{p.th.ink}}; display: flex; align-items: center; justify-content: center">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.th.icon}}"></path></svg>
                  </span>
                  <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                    <span style="font-size: 16px; font-weight: 700; line-height: 1.25">{{p.nome}}</span>
                    <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: #4E4235">{{p.meta}}</span>
                    <span style="margin-top: 2px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 16px; font-weight: 700">{{p.price}}</span>
                  </div>
                  <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">

                    </span>
                    <span style="display: inline-flex; align-items: center; height: 24px; box-sizing: border-box; padding: 0 7px; border: 1.5px solid {{p.pillColor}}; background: {{p.pillBg}}; color: {{p.pillColor}}; font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap">{{p.pillText}}</span>
                  </div>

                <sc-if value="{{p.isAdmin}}" hint-placeholder-val="{{false}}">

                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.ic.pencil}}"></path></svg>
                      {{p.editText}}
                    </button>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
          </sc-if>
        </div>
        </sc-if>

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.chevL}}"></path></svg>

          </button>
          <div style="display: flex; flex-direction: column; align-items: flex-start">

            <p style="margin: -1px 0 0 12px; padding: 5px 10px; background: #105F52; color: #F6ECD8; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase">{{PF.subtitle}}</p>
          </div>
          <sc-if value="{{PF.hasErrs}}" hint-placeholder-val="{{false}}">
            <div role="alert" style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 10px; border: 2px solid #B3361A; background: #FAD5C8; color: #7E200A; font-size: 15px; font-weight: 700">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px"><path d="{{I.alertCircle}}"></path></svg>
              {{PF.errSummary}}
            </div>
          </sc-if>

          <div style="background: #FBF6E8; border: 2px solid #221B16; border-radius: 12px; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
            <div style="display: flex; align-items: center; gap: 16px">
              <sc-if value="{{PF.hasFoto}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="flex: 0 0 88px; height: 88px; box-sizing: border-box; border-radius: 10px; border: 2px solid #221B16; background: {{PF.th.bg}}; color: {{PF.th.ink}}; display: flex; align-items: center; justify-content: center; transform: rotate(-3deg)">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{PF.th.icon}}"></path></svg>
                </span>
              </sc-if>
              <sc-if value="{{PF.noFoto}}" hint-placeholder-val="{{true}}">
                <span aria-hidden="true" style="flex: 0 0 88px; height: 88px; box-sizing: border-box; border-radius: 10px; border: 2px dashed #4E4235; background: #FFFDF6; color: #4E4235; display: flex; align-items: center; justify-content: center">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{I.camera}}"></path></svg>
                </span>
              </sc-if>
              <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
                <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">Foto <span style="font-weight: 400; color: #4E4235">(opcional)</span></span>

                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.camera}}"></path></svg>

                </button>

                <input id="ev-f-nome" type="text" autoComplete="off" value="{{PF.v.nome}}" onChange="{{PF.on.nome}}" aria-invalid="{{PF.inv.nome}}" aria-describedby="ev-f-nome-help" placeholder="Ex.: Camiseta Eleve preta – M" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 14px; border-radius: 10px; border: 2px solid {{PF.border.nome}}; background: #FFFDF6; font-size: 17px; color: #221B16">

                <span id="ev-f-nome-help" style="font-size: 13px; color: #4E4235">Tem tamanho ou cor? Coloque no nome. Ex.: “Moletom Eleve amarelo – G”.</span>

                <select id="ev-f-cat" value="{{PF.v.cat}}" onChange="{{PF.on.cat}}" aria-invalid="{{PF.inv.cat}}" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 12px; border-radius: 10px; border: 2px solid {{PF.border.cat}}; background: #FFFDF6; font-size: 17px; color: #221B16">

                  <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; color: #4E4235">UN.</span>
                </div>
                <sc-if value="{{PF.err.qtd}}" hint-placeholder-val="{{false}}"><span style="display: flex; gap: 6px; align-items: flex-start; color: #B3361A; font-size: 14px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; margin-top: 2px"><path d="{{I.alertCircle}}"></path></svg>{{PF.err.qtd}}</span></sc-if>

              <div style="display: flex; flex-direction: column; gap: 6px">

                  <input id="ev-f-min" type="text" inputmode="numeric" autoComplete="off" value="{{PF.v.min}}" onChange="{{PF.on.min}}" aria-invalid="{{PF.inv.min}}" aria-describedby="ev-f-min-help" placeholder="0" style="flex: 1 1 auto; min-width: 0; height: 100%; border: 0; background: transparent; font-family: 'Space Mono', ui-monospace, monospace; font-size: 17px; color: #221B16">
                  <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; color: #4E4235">UN.</span>

                <sc-if value="{{PF.err.min}}" hint-placeholder-val="{{false}}"><span style="display: flex; gap: 6px; align-items: flex-start; color: #B3361A; font-size: 14px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; margin-top: 2px"><path d="{{I.alertCircle}}"></path></svg>{{PF.err.min}}</span></sc-if>

              </div>
            </div>
          </div>

          <sc-if value="{{PF.isEdit}}" hint-placeholder-val="{{false}}">

  constructor(props) {

    this.toastT = null;

    this.setMain = (el) => { this.mainEl = el; };
    this.onResize = () => { this.measure(); };
    const p = props || {};

  componentDidMount() {
    try { window.addEventListener('resize', this.onResize); } catch (e) {}
    this.measure();
  }

  componentWillUnmount() {

      this.clearTimers();
      this.setState(this.scenario(np.cenario, np.perfil));
      return;
    }
    if (prevState && this.mainEl && (prevState.tab !== this.state.tab || prevState.sub !== this.state.sub)) {
      this.mainEl.scrollTop = 0;
    }
  }

  initialDesktop() {
    try { return window.innerWidth >= 900; } catch (e) { return false; }
  }

  observe() {

    const d = w >= 900;
    if (d !== this.state.desktop) this.setState({ desktop: d });
  }

    const t = setTimeout(() => {
      this.timers = this.timers.filter((x) => x !== t);
      fn();
    }, ms);
    this.timers.push(t);
    return t;
  }

  r2(v) { return Math.round(v * 100) / 100; }

  brl(v) {
    try { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    catch (e) { return 'R$ ' + v.toFixed(2).replace('.', ','); }
  }

  pad(n) { return (n < 10 ? '0' : '') + n; }
  fmtDay(d) { return this.pad(d.getDate()) + '/' + this.pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
  fmtDate(d) { return this.fmtDay(d) + ' ' + this.pad(d.getHours()) + ':' + this.pad(d.getMinutes()); }

  norm(t) {
    return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  simple(t) {
    return this.norm(t).replace(/[^a-z0-9]+/g, ' ').trim();
  }

  matches(p, q) {
    if (!q) return true;
    const hay = ' ' + this.simple(p.nome + ' ' + p.cat) + ' ';
    return this.simple(q).split(' ').filter(Boolean).every((w) => (w.length === 1 ? hay.indexOf(' ' + w + ' ') >= 0 : hay.indexOf(w) >= 0));
  }

  parseNum(t) {
    const v = parseFloat(String(t || '').replace(/\./g, '').replace(',', '.'));
    return isNaN(v) ? 0 : v;
  }

  pctTxt(v) { return String(this.r2(v)).replace('.', ','); }

  status(p) {
    if (p.qtd <= 0) return 'esgotado';
    if (p.qtd <= p.min) return 'baixo';
    return 'normal';
  }

  totals(sale) {
    const sub = this.r2(sale.items.reduce((a, i) => a + i.preco * i.qtd, 0));
    let d = 0;
    if (sale.discUnit === 'pct') d = this.r2(sub * sale.discValue / 100);
    else if (sale.discUnit === 'brl') d = this.r2(sale.discValue);
    return { sub: sub, desc: d, total: this.r2(sub - d) };
  }

  discLabel(sale) {
    if (sale.discUnit === 'pct' && sale.discValue > 0) return 'Desconto (' + this.pctTxt(sale.discValue) + '%)';
    return 'Desconto';
  }

  calc() {
    const s = this.state;
    const by = {};
    s.products.forEach((p) => { by[p.id] = p; });
    const lines = s.cart.filter((c) => by[c.id]).map((c) => ({ c: c, p: by[c.id] }));
    const sub = this.r2(lines.reduce((a, x) => a + x.p.preco * x.c.qty, 0));
    const v = this.parseNum(s.discText);
    let desc = 0;
    let discErr = '';
    if (s.hasDiscount && v > 0) {
      if (s.discUnit === 'pct') {
        if (v > 100) discErr = 'O desconto não pode passar de 100%.';
        else desc = this.r2(sub * v / 100);
      } else {
        if (v > sub) discErr = 'O desconto não pode ser maior que o subtotal (' + this.brl(sub) + ').';
        else desc = this.r2(v);
      }
    }
    const total = this.r2(sub - desc);
    let reason = '';
    if (!lines.length) reason = 'Adicione pelo menos 1 item';
    else if (discErr) reason = 'Corrija o valor do desconto';
    else if (s.hasDiscount && !(v > 0)) reason = 'Informe o desconto ou marque “Não”';
    else if (!s.payment) reason = 'Escolha a forma de pagamento';
    return { lines: lines, sub: sub, desc: desc, total: total, v: v, discErr: discErr, reason: reason, canFinish: !reason && !s.finalizing };
  }

  goTab(t) {
    const s = this.state;
    const patch = { tab: t, sub: null, menuOpen: false, form: null, formErrors: false };
    if ((t === 'estoque' || t === 'historico') && !s.visited[t]) {
      patch.visited = Object.assign({}, s.visited);
      patch.visited[t] = true;
      if (t === 'estoque') patch.stState = 'loading'; else patch.hiState = 'loading';
      this.later(() => this.setState(t === 'estoque' ? { stState: 'ok' } : { hiState: 'ok' }), 800);
    }
    this.setState(patch);
  }

  retryStock() {
    this.setState({ stState: 'loading' });
    this.later(() => this.setState({ stState: 'ok' }), 1200);
  }

  addToCart(id) {
    const s = this.state;
    const p = s.products.find((x) => x.id === id);
    if (!p || p.qtd <= 0) return;
    const cart = s.cart.slice();
    const i = cart.findIndex((c) => c.id === id);
    if (i >= 0) {
      if (cart[i].qty >= p.qtd) return;
      cart[i] = { id: id, qty: cart[i].qty + 1 };
    } else {
      cart.push({ id: id, qty: 1 });
    }
    this.setState({ cart: cart, query: s.desktop ? s.query : '' });
    this.toast('Adicionado: ' + p.nome);
  }

  changeQty(id, d) {
    const s = this.state;
    const p = s.products.find((x) => x.id === id);
    if (!p) return;
    const cart = s.cart.map((c) => (c.id !== id ? c : { id: c.id, qty: Math.max(1, Math.min(p.qtd, c.qty + d)) }));
    this.setState({ cart: cart });
  }

  removeItem(id) {
    this.setState({ cart: this.state.cart.filter((c) => c.id !== id) });
  }

  clearCart() {
    this.setState({ cart: [], hasDiscount: false, discText: '', discUnit: 'pct', payment: null, query: '' });
  }

  setDiscount(v) {
    this.setState({ hasDiscount: v, discText: v ? this.state.discText : '' });
  }

  onDiscInput(e) {
    let v = String((e && e.target && e.target.value) || '').replace(/[^0-9,]/g, '');
    const i = v.indexOf(',');
    if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/,/g, '').slice(0, 2);
    this.setState({ discText: v.slice(0, 9) });
  }

  finalize() {
    const c = this.calc();
    if (!c.canFinish) return;
    if (this.toastT) clearTimeout(this.toastT);
    this.setState({ finalizing: true, toast: '' });
    this.later(() => {
      const s = this.state;
      const no = s.nextNo;
      const sale = this.buildSale(no, new Date(), s.user ? s.user.name : '', s.cart, s.products, s.hasDiscount ? s.discUnit : null, s.hasDiscount ? this.parseNum(s.discText) : 0, s.payment);
      const products = s.products.map((p) => {
        const ci = s.cart.find((x) => x.id === p.id);
        return ci ? Object.assign({}, p, { qtd: Math.max(0, p.qtd - ci.qty) }) : p;
      });
      this.setState({
        products: products, sales: [sale].concat(s.sales), nextNo: no + 1, lastSaleNo: no, sub: 'confirmacao', finalizing: false,
        cart: [], query: '', hasDiscount: false, discText: '', discUnit: 'pct', payment: null
      });
    }, 800);
  }

  openNew() {
    this.setState({ sub: 'produto', formErrors: false, form: { id: null, nome: '', cat: '', preco: '', qtd: '', min: '', foto: false, ativo: true } });
  }

  openEdit(id) {
    const p = this.state.products.find((x) => x.id === id);
    if (!p) return;
    this.setState({
      sub: 'produto', formErrors: false,
      form: { id: p.id, nome: p.nome, cat: p.cat, preco: p.preco.toFixed(2).replace('.', ','), qtd: String(p.qtd), min: String(p.min), foto: true, ativo: p.ativo }
    });
  }

  fieldHandler(k) {
    return (e) => {
      let v = String((e && e.target && e.target.value) || '');
      if (k === 'qtd' || k === 'min') v = v.replace(/[^0-9]/g, '').slice(0, 5);
      if (k === 'preco') {
        v = v.replace(/[^0-9,]/g, '');
        const i = v.indexOf(',');
        if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/,/g, '').slice(0, 2);
      }
      const form = Object.assign({}, this.state.form);
      form[k] = v;
      this.setState({ form: form });
    };
  }

  validate(f, products) {
    const e = {};
    const nome = String(f.nome || '').trim();
    if (!nome) e.nome = 'Informe o nome do produto.';
    else if (nome.length < 3) e.nome = 'O nome precisa ter pelo menos 3 letras.';
    else {
      const key = this.simple(nome);
      const dup = products.find((p) => p.id !== f.id && this.simple(p.nome) === key);
      if (dup) e.nome = dup.ativo ? 'Já existe um produto com esse nome. Para outro tamanho ou cor, inclua no nome.' : 'Já existe um produto inativo com esse nome. Reative-o no estoque.';
    }
    if (!f.cat) e.cat = 'Escolha uma categoria.';
    if (!f.preco) e.preco = 'Informe o preço de venda.';
    else if (!(this.parseNum(f.preco) > 0)) e.preco = 'O preço precisa ser maior que zero.';
    if (f.qtd === '' || f.qtd == null) e.qtd = 'Informe a quantidade (pode ser 0).';
    if (f.min === '' || f.min == null) e.min = 'Informe o estoque mínimo para o alerta.';
    return e;
  }

  saveForm() {
    const s = this.state;
    const f = s.form;
    if (!f) return;
    const e = this.validate(f, s.products);
    if (Object.keys(e).length) {
      this.setState({ formErrors: true });
      if (this.mainEl) this.mainEl.scrollTop = 0;
      return;
    }
    const data = {
      nome: f.nome.trim(), cat: f.cat, preco: this.r2(this.parseNum(f.preco)),
      qtd: parseInt(f.qtd, 10) || 0, min: parseInt(f.min, 10) || 0, ativo: f.ativo
    };
    let products;
    if (f.id) {
      products = s.products.map((p) => (p.id === f.id ? Object.assign({}, p, data) : p));
    } else {
      const id = s.products.reduce((m, p) => Math.max(m, p.id), 0) + 1;
      products = s.products.concat([Object.assign({ id: id }, data)]);
    }
    this.setState({ products: products, sub: null, form: null, formErrors: false });
    this.toast(f.id ? 'Alterações salvas' : 'Produto cadastrado');
  }

  toggleActive() {
    const s = this.state;
    const f = s.form;
    if (!f || !f.id) return;
    const was = f.ativo;
    const products = s.products.map((p) => (p.id === f.id ? Object.assign({}, p, { ativo: !was }) : p));
    const cart = was ? s.cart.filter((c) => c.id !== f.id) : s.cart;
    this.setState({ products: products, cart: cart, sub: null, form: null, formErrors: false });
    this.toast(was ? 'Produto desativado' : 'Produto reativado');
  }

  openSale(no) {
    const visited = Object.assign({}, this.state.visited, { historico: true });
    this.setState({ tab: 'historico', sub: 'detalhe', saleNo: no, visited: visited, hiState: 'ok' });
  }

  renderVals() {
    const s = this.state;
    const I = this.icons();
    const desktop = !!s.desktop;
    const mobile = !desktop;
    const user = s.user || { name: '', initials: '', role: 'vendedor', roleLabel: '', email: '' };
    const isAdmin = user.role === 'admin';
    const app = s.auth === 'in';
    const INK = '#221B16';
    const YEL = '#FBFF0C';

    const scr = {
      login: !app,
      app: app,
      venda: app && s.tab === 'venda' && !s.sub,
      confirm: app && s.tab === 'venda' && s.sub === 'confirmacao',
      estoque: app && s.tab === 'estoque' && !s.sub,
      produto: app && s.tab === 'estoque' && s.sub === 'produto' && !!s.form,
      historico: app && s.tab === 'historico' && !s.sub,
      detalhe: app && s.tab === 'historico' && s.sub === 'detalhe'
    };
    scr.vendaBar = mobile && scr.venda;

    const L = { desktop: desktop, mobile: mobile, mainPad: desktop ? '32px 40px 48px' : '18px 16px 28px', chipWrap: desktop ? 'wrap' : 'nowrap' };

    const cartUnits = s.cart.reduce((a, c) => a + c.qty, 0);
    const tabs = [['venda', desktop ? 'Nova venda' : 'Venda', I.bag], ['estoque', 'Estoque', I.box], ['historico', 'Vendas', I.receipt]].map((d) => {
      const on = s.tab === d[0];
      return {
        label: d[1], icon: d[2], go: () => this.goTab(d[0]), current: on ? 'page' : 'false',

        sideBg: on ? YEL : 'transparent', sideColor: on ? INK : '#F6ECD8',
        badgeBg: on ? INK : YEL, badgeColor: on ? YEL : INK,

      };
    });

    const le = s.loginErr || {};
    const lerr = s.loginStatus === 'error';
    const lloading = s.loginStatus === 'loading';
    const lg = {
      email: s.loginEmail, pass: s.loginPass,
      passType: s.showPass ? 'text' : 'password',
      eyeIcon: s.showPass ? I.eyeOff : I.eye,
      eyeLabel: s.showPass ? 'Ocultar senha' : 'Mostrar senha',

      onKey: (e) => { if (e && e.key === 'Enter') this.doLogin(); },
      togglePass: () => this.setState({ showPass: !this.state.showPass }),
      submit: () => this.doLogin()
    };

    const c = this.calc();
    const q = this.norm(s.query.trim());
    const inCart = {};
    s.cart.forEach((x) => { inCart[x.id] = x.qty; });
    const wantResults = !!q || desktop;
    let found = wantResults ? s.products.filter((p) => p.ativo && this.matches(p, q)) : [];
    const foundN = found.length;
    if (mobile) found = found.slice(0, 6);
    const results = found.map((p) => {
      const n = inCart[p.id] || 0;
      const out = p.qtd <= 0;
      const full = !out && n >= p.qtd;
      const st = this.status(p);
      return {
        nome: p.nome, cat: p.cat, price: this.brl(p.preco), ic: I, th: this.thumb(p.cat),
        stockText: out ? 'Esgotado' : (p.qtd + ' em estoque' + (n ? ' · ' + n + ' no carrinho' : '')),
        stockColor: out ? '#9E2F12' : (st === 'baixo' ? '#7A4A00' : '#4E4235'),
        stockWeight: out || st === 'baixo' ? '800' : '500',
        rowBg: out ? '#F4E9DC' : '#FBF6E8',
        canAdd: !out && !full, disabled: out || full,
        addLabel: out ? 'Esgotado' : (full ? 'No limite' : 'Adicionar'),
        addBg: out ? '#FAD5C8' : (full ? '#E7DCC5' : YEL),
        addColor: out ? '#9E2F12' : (full ? '#4E4235' : INK),
        addBorder: out ? '#B3361A' : (full ? '#8C7B62' : INK),
        aria: out ? p.nome + ': esgotado, não pode ser vendido' : (full ? p.nome + ': todo o estoque já está no carrinho' : 'Adicionar ' + p.nome + ' ao carrinho'),
        add: () => this.addToCart(p.id)
      };
    });

    const cartItems = c.lines.map((x) => {
      const p = x.p;
      const qty = x.c.qty;
      const atMax = qty >= p.qtd;
      return {
        nome: p.nome, unit: this.brl(p.preco) + ' cada', qty: String(qty), subtotal: this.brl(this.r2(p.preco * qty)),
        th: this.thumb(p.cat), ic: I, atMax: atMax,
        maxText: p.qtd === 1 ? 'Só há 1 unidade em estoque. Não é possível adicionar mais.' : 'Só há ' + p.qtd + ' unidades em estoque. Não é possível adicionar mais.',
        decDisabled: qty <= 1, incDisabled: atMax,
        decColor: qty <= 1 ? '#A89A82' : INK, incColor: atMax ? '#A89A82' : INK,
        decBg: qty <= 1 ? '#EFE7D6' : '#FBF6E8', incBg: atMax ? '#EFE7D6' : '#FBF6E8',
        dec: () => this.changeQty(p.id, -1), inc: () => this.changeQty(p.id, 1), remove: () => this.removeItem(p.id),
        decLabel: 'Diminuir quantidade de ' + p.nome, incLabel: 'Aumentar quantidade de ' + p.nome,
        removeLabel: 'Remover ' + p.nome + ' da venda', groupLabel: 'Quantidade de ' + p.nome
      };
    });

    const seg = (on) => ({ bg: on ? YEL : '#FBF6E8', border: on ? INK : '#4E4235', bw: on ? '3px' : '1.5px', pressed: on ? 'true' : 'false' });
    const unitSeg = (on) => ({ bg: on ? INK : '#FBF6E8', color: on ? YEL : INK, pressed: on ? 'true' : 'false' });
    const pct = s.discUnit === 'pct';
    const pays = [['pix', 'Pix', I.pix], ['debito', 'Débito', I.card], ['credito', 'Crédito', I.cards], ['dinheiro', 'Dinheiro', I.cash]].map((d) => {
      const on = s.payment === d[0];
      return Object.assign({ label: d[1], icon: d[2], on: on, ic: I, pick: () => this.setState({ payment: d[0] }) }, seg(on));
    });
    const canGo = c.canFinish || s.finalizing;
    const V = {
      sellerLine: 'Registrando como ' + user.name,
      query: s.query, hasQuery: !!s.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      clearQuery: () => this.setState({ query: '' }),
      showResults: wantResults && foundN > 0,
      noResults: !!q && foundN === 0,
      noResultsText: 'Nada encontrado para “' + s.query.trim() + '”. Tente só uma palavra do nome, como “camiseta” ou “bíblia”.',
      results: results,
      resultsTitle: q ? foundN + (foundN === 1 ? ' produto encontrado' : ' produtos encontrados') : 'Produtos ativos',
      moreText: mobile && foundN > 6 ? 'Mostrando 6 de ' + foundN : '',
      cartItems: cartItems, hasItems: cartItems.length > 0, empty: cartItems.length === 0,
      itemCountText: cartUnits === 1 ? '1 unidade' : cartUnits + ' unidades',
      emptyHint: desktop ? 'Escolha um produto na lista ao lado ou busque pelo nome.' : 'Busque um produto pelo nome para começar a venda.',
      clearCart: () => this.clearCart(),
      discNo: Object.assign({ pick: () => this.setDiscount(false) }, seg(!s.hasDiscount)),
      discYes: Object.assign({ pick: () => this.setDiscount(true) }, seg(s.hasDiscount)),
      hasDiscount: s.hasDiscount,
      unitPct: Object.assign({ pick: () => this.setState({ discUnit: 'pct' }) }, unitSeg(pct)),
      unitBrl: Object.assign({ pick: () => this.setState({ discUnit: 'brl' }) }, unitSeg(!pct)),
      showPrefix: !pct, showSuffix: pct,
      discText: s.discText, onDisc: (e) => this.onDiscInput(e),
      discPlaceholder: pct ? '0' : '0,00',
      discErr: c.discErr,
      discBorder: c.discErr ? '#B3361A' : '#4E4235',
      discInvalid: c.discErr ? 'true' : 'false',
      discLive: !c.discErr && c.desc > 0 ? 'Desconto de ' + this.brl(c.desc) + ' · Total: ' + this.brl(c.total) : '',
      discHelp: !c.discErr && !(c.desc > 0) ? (pct ? 'Digite o percentual. Ex.: 10 para 10%.' : 'Digite o valor em reais. Ex.: 20,00.') : '',
      pays: pays,
      sub: this.brl(c.sub),
      descLabel: s.hasDiscount && pct && c.v > 0 && !c.discErr ? 'Desconto (' + this.pctTxt(c.v) + '%)' : 'Desconto',
      descValue: s.hasDiscount ? '−' + this.brl(c.desc) : 'Sem desconto',
      descColor: s.hasDiscount ? '#FFC9B8' : '#BFD8D0',
      total: this.brl(c.total),
      reason: s.finalizing ? '' : c.reason,
      finalizing: !!s.finalizing,
      finDisabled: !c.canFinish,
      finLabel: s.finalizing ? 'Registrando…' : 'Finalizar venda',
      finBarBg: canGo ? YEL : '#0B4A40',
      finBarColor: canGo ? INK : '#C9DAD4',
      finBarBorder: canGo ? '2px solid ' + INK : '2px dashed #6E9C91',
      finDeskBg: canGo ? YEL : '#E3D9C4',
      finDeskColor: canGo ? INK : '#5E5040',
      finDeskBorder: canGo ? '2px solid ' + INK : '2px dashed #8C7B62',
      finShadow: c.canFinish ? '0 4px 0 ' + INK : 'none',
      finalize: () => this.finalize()
    };

    const ls = s.sales.find((x) => x.no === s.lastSaleNo);
    let C = { items: [] };
    if (ls) {
      const t = this.totals(ls);
      const pi = this.payInfo(ls.payment);
      C = {
        no: '#' + ls.no, total: this.brl(t.total), pay: pi.label, payIcon: pi.icon, date: this.fmtDate(ls.date), vendedor: ls.vendedor,
        items: ls.items.map((i) => ({ line: i.qtd + '× ' + i.nome, val: this.brl(this.r2(i.preco * i.qtd)) })),
        sub: this.brl(t.sub), descLabel: this.discLabel(ls), desc: t.desc > 0 ? '−' + this.brl(t.desc) : 'Sem desconto'
      };
    }
    C.newSale = () => this.setState({ sub: null, tab: 'venda' });
    C.seeIt = () => { if (ls) this.openSale(ls.no); };

    const visible = s.products.filter((p) => isAdmin || p.ativo);
    const low = s.products.filter((p) => p.ativo && this.status(p) === 'baixo');
    const outN = s.products.filter((p) => p.ativo && p.qtd <= 0).length;
    const activeN = s.products.filter((p) => p.ativo).length;
    const inactiveN = s.products.length - activeN;
    const sq = this.norm(s.stQuery.trim());
    const list = visible.filter((p) => (s.stCat === 'Todas' || p.cat === s.stCat)
      && this.matches(p, sq)
      && (!s.lowOnly || (p.ativo && this.status(p) === 'baixo')))
      .sort((a, b) => (a.ativo === b.ativo ? 0 : (a.ativo ? -1 : 1)));
    const pills = {
      normal: ['Em estoque', '#D2E5DD', '#0B4A40'],
      baixo: ['Baixo', YEL, INK],
      esgotado: ['Esgotado', '#FAD5C8', '#9E2F12'],
      inativo: ['Inativo', '#E2D8C6', '#4E4235']
    };
    const items = list.map((p) => {
      const st = p.ativo ? this.status(p) : 'inativo';
      const pl = pills[st];
      return {
        nome: p.nome, meta: p.cat + ' · mín. ' + p.min, price: this.brl(p.preco), qtyNum: String(p.qtd),
        qtyColor: st === 'esgotado' ? '#9E2F12' : INK, pillText: pl[0], pillBg: pl[1], pillColor: pl[2],
        th: this.thumb(p.cat), ic: I, isAdmin: isAdmin, cardBg: p.ativo ? '#FBF6E8' : '#E9E0CD',
        edit: () => this.openEdit(p.id), editLabel: (p.ativo ? 'Editar ' : 'Editar ou reativar ') + p.nome,
        editText: p.ativo ? 'Editar' : 'Editar / reativar'
      };
    });
    const cats = ['Todas'].concat(this.cats()).map((cn) => {
      const on = s.stCat === cn;
      return { label: cn, pick: () => this.setState({ stCat: cn }), bg: on ? INK : '#FBF6E8', color: on ? YEL : INK, border: on ? INK : '#4E4235', pressed: on ? 'true' : 'false' };
    });
    const E = {
      isAdmin: isAdmin,
      loading: s.stState === 'loading', error: s.stState === 'error',
      list: s.stState === 'ok' && items.length > 0, empty: s.stState === 'ok' && items.length === 0,
      items: items, cats: cats,
      skeletons: ['72%', '58%', '80%', '64%', '70%', '52%'].map((w) => ({ w: w })),
      countText: isAdmin ? activeN + ' ativos · ' + inactiveN + (inactiveN === 1 ? ' inativo' : ' inativos') : activeN + ' produtos',
      showLowBanner: s.stState === 'ok' && low.length > 0 && !s.lowOnly,
      lowOnly: s.lowOnly && s.stState === 'ok',
      lowTitle: low.length === 1 ? '1 produto com estoque baixo' : low.length + ' produtos com estoque baixo',
      lowSub: 'Toque para ver só esses' + (outN ? ' · ' + outN + (outN === 1 ? ' esgotado' : ' esgotados') : ''),
      lowOnlyText: 'Só estoque baixo (' + low.length + ')',
      toggleLow: () => this.setState({ lowOnly: !this.state.lowOnly, stCat: 'Todas', stQuery: '' }),
      query: s.stQuery, hasQuery: !!s.stQuery,
      onQuery: (e) => this.setState({ stQuery: e.target.value }),
      clearQuery: () => this.setState({ stQuery: '' }),
      emptyTitle: sq ? 'Nenhum produto encontrado' : 'Nada nesta seleção',
      emptyText: sq ? 'Não encontramos “' + s.stQuery.trim() + '” no estoque. Tente só uma palavra do nome.' : 'Nenhum produto nesta categoria com o filtro atual.',
      clearFilters: () => this.setState({ stQuery: '', stCat: 'Todas', lowOnly: false }),
      newProduct: () => this.openNew(),
      retry: () => this.retryStock()
    };

    const f = s.form || { id: null, nome: '', cat: '', preco: '', qtd: '', min: '', foto: false, ativo: true };
    const ve = s.form && s.formErrors ? this.validate(f, s.products) : {};
    const err = {};
    const border = {};
    const inv = {};
    const on = {};
    ['nome', 'cat', 'preco', 'qtd', 'min'].forEach((k) => {
      err[k] = ve[k] || '';
      border[k] = ve[k] ? '#B3361A' : '#4E4235';
      inv[k] = ve[k] ? 'true' : 'false';
      on[k] = this.fieldHandler(k);
    });
    const nErr = Object.keys(ve).length;
    const PF = {
      title: f.id ? 'Editar produto' : 'Novo produto',
      subtitle: f.id ? 'Altere os dados e salve' : 'Cadastro no estoque',
      isEdit: !!f.id, v: f, err: err, border: border, inv: inv, on: on,
      hasErrs: nErr > 0,
      errSummary: nErr === 1 ? 'Corrija 1 campo destacado para salvar.' : 'Corrija ' + nErr + ' campos destacados para salvar.',
      hasFoto: !!f.foto, noFoto: !f.foto, th: this.thumb(f.cat),
      fotoLabel: f.foto ? 'Trocar foto' : 'Adicionar foto',
      fotoHelp: f.foto ? 'Foto adicionada' : 'Tire uma foto ou escolha da galeria.',
      toggleFoto: () => this.setState({ form: Object.assign({}, this.state.form, { foto: !this.state.form.foto }) }),
      statusTitle: f.ativo ? 'Produto ativo' : 'Produto inativo',
      statusHelp: f.ativo ? 'Aparece no estoque e pode ser vendido.' : 'Não aparece para os vendedores nem na venda.',
      actLabel: f.ativo ? 'Desativar produto' : 'Reativar produto',
      actColor: f.ativo ? '#9E2F12' : '#0B4A40', actBorder: f.ativo ? '#B3361A' : '#105F52',
      toggleActive: () => this.toggleActive(),
      save: () => this.saveForm(),
      cancel: () => this.setState({ sub: null, form: null, formErrors: false }),
      saveLabel: f.id ? 'Salvar alterações' : 'Cadastrar produto'
    };

    const sorted = s.sales.slice().sort((a, b) => b.date - a.date);
    const wd = ['dom.', 'seg.', 'ter.', 'qua.', 'qui.', 'sex.', 'sáb.'];
    const groups = [];
    let cur = null;
    sorted.forEach((v) => {
      const day = this.fmtDay(v.date);
      if (!cur || cur.key !== day) {
        cur = { key: day, day: wd[v.date.getDay()] + ', ' + day, count: '', sales: [] };
        groups.push(cur);
      }
      const t = this.totals(v);
      const pi = this.payInfo(v.payment);
      cur.sales.push({
        no: '#' + v.no, dateTime: this.fmtDate(v.date), vendedor: v.vendedor,
        itemsLine: v.items.map((i) => i.qtd + '× ' + i.nome).join(', '),
        sub: this.brl(t.sub), desc: t.desc > 0 ? '−' + this.brl(t.desc) : this.brl(0), total: this.brl(t.total),
        pay: pi.label, payIcon: pi.icon, ic: I, open: () => this.openSale(v.no)
      });
    });
    groups.forEach((g) => { g.count = g.sales.length + (g.sales.length === 1 ? ' venda' : ' vendas'); });
    const H = {
      loading: s.hiState === 'loading',
      has: s.hiState !== 'loading' && sorted.length > 0,
      empty: s.hiState !== 'loading' && sorted.length === 0,
      groups: groups,
      subtitle: sorted.length ? 'Mais recentes primeiro · ' + sorted.length + (sorted.length === 1 ? ' venda' : ' vendas') : 'Mais recentes primeiro',
      skeletons: ['80%', '60%', '72%', '50%'].map((w) => ({ w: w })),
      goSell: () => this.goTab('venda')
    };

    const ds = s.sales.find((x) => x.no === s.saleNo);
    let D = { items: [] };
    if (ds) {
      const t = this.totals(ds);
      const pi = this.payInfo(ds.payment);
      const units = ds.items.reduce((a, i) => a + i.qtd, 0);
      D = {
        no: '#' + ds.no, dateTime: this.fmtDate(ds.date), vendedor: ds.vendedor, pay: pi.label, payIcon: pi.icon,
        nItems: units === 1 ? '1 unidade' : units + ' unidades',
        items: ds.items.map((i) => ({ nome: i.nome, line: i.qtd + ' × ' + this.brl(i.preco), sub: this.brl(this.r2(i.preco * i.qtd)) })),
        sub: this.brl(t.sub), descLabel: this.discLabel(ds), desc: t.desc > 0 ? '−' + this.brl(t.desc) : 'Sem desconto', total: this.brl(t.total)
      };
    }
    D.back = () => this.setState({ sub: null, saleNo: null });

    const M = {
      name: user.name, initials: user.initials, email: user.email, roleLabel: user.roleLabel,
      roleHelp: isAdmin ? 'Pode cadastrar, editar e desativar produtos.' : 'Registra vendas e consulta estoque e histórico.',
      roleBg: isAdmin ? INK : '#105F52', roleColor: isAdmin ? YEL : '#F6ECD8',
      open: !!s.menuOpen && mobile && app, expanded: s.menuOpen ? 'true' : 'false',
      toggle: () => this.setState({ menuOpen: !this.state.menuOpen }),
      close: () => this.setState({ menuOpen: false }),
      logout: () => this.logout()
    };

    const T = { show: !!s.toast && app, text: s.toast, bottom: mobile ? (scr.vendaBar ? '196px' : '92px') : '28px' };

    return { I: I, L: L, scr: scr, tabs: tabs, lg: lg, V: V, C: C, E: E, PF: PF, H: H, D: D, M: M, T: T, setRoot: this.setRoot, setMain: this.setMain };
  }
}
DC.mount(Component);
</script>
</body>
</html>
